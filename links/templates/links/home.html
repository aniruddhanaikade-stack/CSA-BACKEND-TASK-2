{% extends "links/base.html" %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <label for="long_url">Paste a long URL:</label>
  <input type="text" id="long_url" name="long_url" value="{{ text|default:'' }}" placeholder="https://example.com/very/long/page">
  <button type="submit">Shorten</button>
</form>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

{% if link %}
  <div class="ok">
    {% if was_created %}Short link created!{% else %}This URL was already shortened. Here is the same link:{% endif %}
    <p><a href="{{ short_url }}">{{ short_url }}</a></p>
    <p><a href="{{ stats_url }}">See stats</a></p>
  </div>
{% endif %}
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Shortener{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
    input[type=text] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 18px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .error { background: #fdecea; color: #a12622; padding: 10px; border-radius: 4px; }
    .ok { background: #e8f5e9; color: #1b5e20; padding: 10px; border-radius: 4px; }
    table td { padding: 6px 12px 6px 0; vertical-align: top; word-break: break-all; }
  </style>
</head>
<body>
  <h1><a href="/" style="text-decoration:none;color:inherit">URL Shortener</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
